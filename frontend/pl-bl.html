<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile Form</title>
    <link rel="stylesheet" href="pl-bl.css">
    <link rel="stylesheet" href="css/ui-fixes.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            z-index: 9999; overflow: hidden;
        }
        .modal.active { display: flex !important; align-items: center; justify-content: center; }
        .modal-content {
            position: relative; width: 90%; max-width: 1000px; height: 90vh;
            background: #fff; border-radius: 15px; overflow: hidden;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            display: flex; flex-direction: column;
        }
        #pdfPreview { width: 100%; height: 100%; border: none; flex: 1; }

        .success-popup {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 99999;
            display: flex; align-items: center; justify-content: center;
        }
        .success-popup-content {
          background: white; border-radius: 10px; padding: 14px 16px;
          max-width: 360px; width: auto;
          box-shadow: 0 10px 30px rgba(0,0,0,0.18); text-align: center;
          animation: slideUpModal 0.22s ease;
        }
        .success-popup-content h3 {
          color: #0a2a55; font-size: 16px; margin: 6px 0 10px;
          font-weight: 800;
        }
        .info-row {
          display: flex; justify-content: space-between; align-items: center;
          padding: 6px 0; border-bottom: none;
          font-size: 13px; text-align: left;
        }
        .info-row span:first-child { font-weight: 700; color: #333; min-width: 90px; }
        .info-row span:last-child  { color: #0a2a55; word-break: break-all; }
        .ok-btn {
          margin-top: 12px; background: linear-gradient(135deg,#1f5bb5,#0d3a73);
          color: white; border: none; padding: 8px 18px; border-radius: 8px;
          font-size: 14px; font-weight: 700; cursor: pointer; display: inline-block;
        }
        .dash-btn {
          margin-top: 10px; background: transparent;
          color: #1f5bb5; border: none; padding: 8px 18px; border-radius: 8px;
          font-size: 13px; font-weight: 700; cursor: pointer; display: inline-block;
          text-decoration: none;
        }
        #autoSaveIndicator {
            position: fixed; bottom: 20px; left: 20px;
            background: #0a2a55; color: white;
            padding: 8px 16px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
            opacity: 0; transition: opacity 0.3s;
            z-index: 999;
        }
        #autoSaveIndicator.show { opacity: 1; }

        @keyframes slideUpModal {
            from { transform: translateY(50px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<!--
  Customer Profile Form (PL / BL / HL etc.)

  Execution / interaction flow:
  1. Page renders the customer form and its various conditional sections (renewal, HL/LAP, documents, etc.).
  2. Client-side scripts (later in this file) manage form state, autosave, file uploads and submit behavior.
  3. On submit, the form posts to the server endpoints (in `server.js`) which create/update Customer, BankerRequirement and PropertyRequirement records.
  4. After successful save the page may show preview/download links or redirect to the dashboard depending on user actions.

  Notes:
  - Look for `fetch` or `form.submit` handlers in the script area to find the exact API endpoints used.
  - The page contains both front and back sides of a flip-card; toggling is handled in the scripts below.
-->

</div>

<script>

///////////////////////////////////////////////////////////////
// STATE
///////////////////////////////////////////////////////////////
let currentGeneratedId = null;
let isEditMode         = false;
let autoSaveTimer      = null;

///////////////////////////////////////////////////////////////
// ON PAGE LOAD
///////////////////////////////////////////////////////////////
window.addEventListener("DOMContentLoaded", async () => {
    applyCurrencyFormatting();
    setupAutoSave();
    setupLoanTypeListener();
    setupCoApplicantListener();

    const pathParts = window.location.pathname.split("/");
    const editIndex = pathParts.indexOf("edit");

    if (editIndex !== -1 && pathParts[editIndex + 1]) {
        isEditMode = true;
        currentGeneratedId = pathParts[editIndex + 1];
        await prefillForm(currentGeneratedId);
    }
});

///////////////////////////////////////////////////////////////
// LOAN TYPE — SHOW/HIDE SECTIONS
///////////////////////////////////////////////////////////////
function setupLoanTypeListener() {
    document.getElementById("loanType").addEventListener("change", function () {
        const val = this.value;
        document.getElementById("renewalFields").style.display   = val.includes("renewal") ? "block" : "none";

        const isHlLap = val.includes("-hl") || val.includes("-lap") || val.includes("-ppl") || val.includes("-p+c");
        document.getElementById("hlLapFields").style.display        = isHlLap ? "block" : "none";
        document.getElementById("coApplicantSection").style.display = isHlLap ? "block" : "none";

        const cibilLabel = document.getElementById("cibilLabel");
        const cibilFile  = document.getElementById("cibilFile");
        if (isHlLap) {
            cibilLabel.innerText    = "CIBIL Report *";
            cibilFile.style.display = "block";
        } else {
            cibilLabel.innerText    = "CIBIL Score";
            cibilFile.style.display = "none";
            document.getElementById("coApplicantFields").style.display = "none";
        }
    });
}

///////////////////////////////////////////////////////////////
// CO-APPLICANT SHOW/HIDE
///////////////////////////////////////////////////////////////
function setupCoApplicantListener() {
    document.getElementById("coApplicant").addEventListener("change", function () {
        document.getElementById("coApplicantFields").style.display = this.value === "Yes" ? "block" : "none";
    });
}

///////////////////////////////////////////////////////////////
// CURRENCY FORMATTING
///////////////////////////////////////////////////////////////
function formatIndianNumberSystem(num) {
    num = Number(String(num).replace(/[^0-9]/g, ""));
    if (!num) return "";
    return "₹ " + num.toLocaleString("en-IN");
}

function applyCurrencyFormatting(context = document) {
    context.querySelectorAll(".currency-input").forEach(input => {
        if (input.dataset.formatted) return;
        input.dataset.formatted = "1";

        input.addEventListener("focus", function () {
            this.value = this.value.replace(/[^0-9]/g, "");
        });
        input.addEventListener("blur", function () {
            let raw = this.value.replace(/[^0-9]/g, "");
            if (raw) this.value = formatIndianNumberSystem(raw);
            else this.value = "";
        });
    });
}

///////////////////////////////////////////////////////////////
// AUTO-SAVE ON BLUR
///////////////////////////////////////////////////////////////
function setupAutoSave() {
    document.getElementById("leadForm").addEventListener("focusout", async (e) => {
        const el = e.target;
        if (el.type === "file" || el.type === "submit" || el.type === "button") return;

        const email = document.getElementById("applicantEmail").value.trim();
        const phone = document.getElementById("applicantNumber").value.trim();
        if (!email && !phone) return;

        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(() => doAutoSave(email, phone), 800);
    });
}

async function doAutoSave(email, phone) {
    try {
        const formData = collectTextFields();
        const res = await fetch("/auto-save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, phone, formData: formData })
});
        const result = await res.json();

        if (result.isExisting && result.customerId && !isEditMode) {
            currentGeneratedId = result.customerId;
        }

        showAutoSaveIndicator();
    } catch (err) {
        console.error("Auto-save failed:", err);
    }
}

function showAutoSaveIndicator() {
    const el = document.getElementById("autoSaveIndicator");
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2000);
}

///////////////////////////////////////////////////////////////
// COLLECT TEXT FIELDS
///////////////////////////////////////////////////////////////
function collectTextFields() {
    const payload = {};
    const g = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    const clean = (v) => v.replace(/[^0-9]/g, "");
    const addIf = (key, val) => { if (val) payload[key] = val; };

    addIf("loanType",           g("loanType"));
    addIf("applicantName",      g("applicantName"));
    addIf("applicantNumber",    g("applicantNumber"));
    addIf("applicantEmail",     g("applicantEmail"));
    addIf("dob",                g("dob"));
    addIf("residentialAddress", g("applicationResidence"));
    addIf("bankCredit",         g("bankCredit"));
    addIf("loanRequired",       clean(g("loanRequired")));

    // Radio — nameType
    const nameType = document.querySelector('input[name="nameType"]:checked')?.value;
    addIf("nameType", nameType);
    const dobType = document.querySelector('input[name="dobType"]:checked')?.value;
    addIf("dobType", dobType);

    // Renewal
    addIf("existingBank",     g("existingBank"));
    addIf("outstandingAmount",clean(g("outstandingAmount")));
    addIf("currentEmi",       clean(g("currentEmi")));
    addIf("topupAmount",      clean(g("topupAmount")));
    addIf("interestRate",     g("interestRate"));
    addIf("loanSince",        g("loanSince"));

    // HL/LAP
    addIf("propertyType",    g("propertyType"));
    addIf("propertyLocation",g("propertyLocation"));
    addIf("authorityType",   g("authorityType"));
    addIf("budget",          clean(g("budget")));

    // Employment
    const empType = document.querySelector('input[name="employmentType"]:checked')?.value;
    addIf("employmentType", empType);

    if (empType === "salaried") {
        addIf("companyName",      g("companyName"));
        addIf("designation",      g("desg"));
        addIf("companyIdCard",    g("companyIdCard"));
        addIf("totalExperience",  g("experience"));
        addIf("presentCompanyExp",g("presentCompanyExp"));
        addIf("cibil",            g("cibil"));
        addIf("grossSalary",      clean(g("grossSalary")));
        addIf("annualSalary",     clean(g("annualSalary")));
        addIf("currentCTC",       clean(g("currentCTC")));
        addIf("latestSalary",     clean(g("latestSalary")));
        addIf("lastSalary",       clean(g("lastSalary")));
        addIf("beforeLastSalary", clean(g("beforeLastSalary")));
        addIf("form16Desc",       g("form16Desc"));
        addIf("form26Desc",       g("form26Desc"));
        const form16 = document.querySelector('input[name="form16"]:checked')?.value;
        addIf("form16Available", form16);
    }

    if (empType === "selfEmployed") {
        addIf("businessName",  g("businessName"));
        addIf("officePhone",   g("officePhone"));
        addIf("businessType",  g("businessType"));
        addIf("monthlyIncome", clean(g("monthlyIncome")));
        addIf("businessEmail", g("businessEmail"));
        addIf("businessPhone", g("businessPhone"));
        addIf("rentalIncome",  clean(g("rentalIncome")));
        addIf("businessYears", g("businessYears"));
        addIf("cibil",         g("cibilSE"));
    }

    const coApplicantVal = g("coApplicant");
    addIf("coApplicant", coApplicantVal);
    if (coApplicantVal === "Yes") {
        addIf("coName",             g("coName"));
        addIf("coNumber",           g("coNumber"));
        addIf("coEmail",            g("coEmail"));
        addIf("coSalary",           clean(g("coSalary")));
        addIf("coLatestSalary",     clean(g("coLatestSalary")));
        addIf("coLastSalary",       clean(g("coLastSalary")));
        addIf("coBeforeLastSalary", clean(g("coBeforeLastSalary")));
        addIf("coBankCredit",       g("coBankCredit"));
        addIf("coLoanRequired",     clean(g("coLoanRequired")));
    }

    // Existing loans
    const existingLoans = [];
    document.querySelectorAll(".loan-block").forEach(block => {
        const lt = block.querySelector(".loanType")?.value || "";
        const eb = block.querySelector(".existingBank")?.value || "";
        const oa = (block.querySelector(".outstandingAmount")?.value || "").replace(/[^0-9]/g,"");
        const ce = (block.querySelector(".currentEmi")?.value || "").replace(/[^0-9]/g,"");
        const ta = (block.querySelector(".topupAmount")?.value || "").replace(/[^0-9]/g,"");
        const ir = block.querySelector(".interestRate")?.value || "";
        const ls = block.querySelector(".loanSince")?.value || "";
        if (lt || eb || oa) existingLoans.push({ loanType:lt, existingBank:eb, outstandingAmount:oa, currentEmi:ce, topupAmount:ta, interestRate:ir, loanSince:ls });
    });
    if (existingLoans.length) payload.existingLoans = existingLoans;

    // Co-applicant loans
    const coLoans = [];
    document.querySelectorAll(".co-loan-block").forEach(block => {
        const lt = block.querySelector(".coLoanType")?.value || "";
        const eb = block.querySelector(".existingBank")?.value || "";
        const oa = (block.querySelector(".outstandingAmount")?.value || "").replace(/[^0-9]/g,"");
        const ce = (block.querySelector(".currentEmi")?.value || "").replace(/[^0-9]/g,"");
        const ta = (block.querySelector(".topupAmount")?.value || "").replace(/[^0-9]/g,"");
        const ir = block.querySelector(".interestRate")?.value || "";
        const ls = block.querySelector(".loanSince")?.value || "";
        if (lt || oa) coLoans.push({ loanType:lt, existingBank:eb, outstandingAmount:oa, currentEmi:ce, topupAmount:ta, interestRate:ir, loanSince:ls });
    });
    if (coLoans.length) payload.coLoans = coLoans;

    // Legal docs
    const legalDocs = [];
    document.querySelectorAll(".legal-doc-block").forEach(block => {
        const dn = block.querySelector(".docName")?.value || "";
        const ow = block.querySelector(".owner")?.value || "";
        const fv = block.querySelector(".favourof")?.value || "";
        const no = block.querySelector(".docNumber")?.value || "";
        const ry = block.querySelector(".regYear")?.value || "";
        const n  = block.querySelector(".northBoundary")?.value || "";
        const s  = block.querySelector(".southBoundary")?.value || "";
        const e  = block.querySelector(".eastBoundary")?.value || "";
        const w  = block.querySelector(".westBoundary")?.value || "";
        if (dn || ow || n) legalDocs.push({ docName:dn, owner:ow, favourof:fv, docNumber:no, regYear:ry, north:n, south:s, east:e, west:w });
    });
    if (legalDocs.length) payload.legalDocs = legalDocs;

    return payload;
}

///////////////////////////////////////////////////////////////
// PDF GENERATION
///////////////////////////////////////////////////////////////
function generatePDFDoc() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const img = document.getElementById("logo");
    try { if (img.complete && img.naturalWidth > 0) doc.addImage(img, "JPEG", 0, 0, 210, 297); } catch(e) {}

    const sensitiveIds = new Set(["applicantName","applicantNumber","applicantEmail","coName","coNumber","coEmail"]);
    const formatForPDF = (v, id) => {
      if (!v) return "";
      const s = String(v).replace(/₹/g, "Rs.");
      if (id && sensitiveIds.has(id)) return "****";
      return s;
    };

    let startY = 50;
    doc.setFontSize(16);
    doc.setTextColor(10, 42, 85);
    doc.setFont(undefined, "bold");
    doc.text("Customer Profile", 105, startY - 10, { align: "center" });
    if (currentGeneratedId) {
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.text(`Customer ID: ${currentGeneratedId}`, 15, startY - 2);
    }

    const details = [];
    document.querySelectorAll("#leadForm input, #leadForm select, #leadForm textarea").forEach(field => {
        if (field.type === "button" || field.type === "submit" || field.type === "file") return;
        if (field.classList.contains("skip-preview")) return;
        if ((field.type === "radio" || field.type === "checkbox") && !field.checked) return;
        const value = field.value?.trim();
        if (!value) return;

        let label = "";
        const fg = field.closest(".form-group");
        if (fg) { const lt = fg.querySelector("label"); if (lt) label = lt.innerText.replace("*","").trim(); }
        if (!label) label = field.id || "Field";
        details.push([label, formatForPDF(value, field.id)]);
    });

    // Ensure Customer ID is present in the details table
    if (currentGeneratedId) details.unshift(["Customer ID", currentGeneratedId]);
    doc.autoTable({ startY, head:[["Field","Details"]], body:details, headStyles:{ fillColor:[10,42,85], textColor:255 }, styles:{fontSize:9} });

    return doc;
}

///////////////////////////////////////////////////////////////
// SUBMIT
///////////////////////////////////////////////////////////////
document.getElementById("leadForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!this.checkValidity()) { alert("Please fill all required fields"); return; }

    const submitBtn = this.querySelector('button[type="submit"]');
    submitBtn.disabled    = true;
    submitBtn.textContent = "Submitting...";

    try {
        const formData = collectTextFields();

        // Generate ID if not yet assigned
        if (!currentGeneratedId) {
            // const idRes  = await fetch(`/generate-id?name=${encodeURIComponent(document.getElementById("applicantName").value.trim())}`);
            const idRes  = await fetch(`/generate-id`);
            const idData = await idRes.json();
            currentGeneratedId = idData.customerId;
        }

        // Generate summary PDF
        const doc = generatePDFDoc();
        const applicantNameVal = (document.getElementById("applicantName").value || "customer")
            .trim().replace(/\s+/g,"_").replace(/[^a-zA-Z0-9_]/g,"");
        const fileName = `${currentGeneratedId}_${applicantNameVal}.pdf`;

        const pdfBlob = doc.output("blob");
        const pdfFile = new File([pdfBlob], fileName, { type:"application/pdf" });

        // Build FormData
        const fd = new FormData();
        fd.append("customerId", currentGeneratedId);
        fd.append("data",       JSON.stringify(formData));
        fd.append("summaryPdf", pdfFile);

        // Single-file fields
        ["cibilFile","offerLetter","appointmentLetter","relievingLetter","form16File","form26File","gstFiles","labourFiles"].forEach(fId => {
            const el = document.getElementById(fId);
            if (el && el.files && el.files[0]) fd.append(fId, el.files[0]);
        });

        // Multi-file fields
        ["itrFiles","bankFiles"].forEach(fId => {
            const el = document.getElementById(fId);
            if (el && el.files && el.files.length) {
                Array.from(el.files).forEach(f => fd.append(fId, f));
            }
        });

        const res    = await fetch("/submit-lead", { method:"POST", body:fd });
        const result = await res.json();

        if (!res.ok) throw new Error(result.error || "Submit failed");

        showSuccessPopup(result.customerId, result.hyperlink, result.version, result.message);

        // Reset form
        this.reset();
        ["hlLapFields","coApplicantSection","coApplicantFields","renewalFields","salariedSection","selfEmpSection"].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = "none";
        });
        document.getElementById("loanContainer").innerHTML   = "";
        document.getElementById("coLoanContainer").innerHTML = "";
        currentGeneratedId = null;
        isEditMode         = false;

    } catch (err) {
        console.error(err);
        showErrorToast(err.message);
    } finally {
        submitBtn.disabled    = false;
        submitBtn.textContent = "Submit";
    }
});

function showSuccessPopup(customerId, hyperlink, version, message) {
    const popup = document.createElement("div");
    popup.className = "success-popup";
    popup.id        = "successPopup";
  popup.innerHTML = `
    <div class="success-popup-content">
      <h3>✅ ${message === "Updated" ? "Updated Successfully!" : "Submitted Successfully!"}</h3>
      <div class="info-row"><span>Customer ID</span><span>${customerId}</span></div>
      <div class="info-row"><span>Version</span><span>v${version}</span></div>
      <button class="ok-btn" onclick="document.getElementById('successPopup').remove()">OK</button>
      <a href="/dashboard" class="dash-btn">Go to Dashboard</a>
    </div>`;
    document.body.appendChild(popup);
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => alert("✅ Copied!")).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta); alert("✅ Copied!");
    });
}

function showErrorToast(msg) {
    const el = document.createElement("div");
    el.style.cssText = "position:fixed;top:20px;right:20px;background:#ff4d4f;color:white;padding:15px 25px;border-radius:10px;font-size:15px;font-weight:600;box-shadow:0 5px 15px rgba(0,0,0,.3);z-index:99999;animation:slideIn .3s ease";
    el.textContent = "❌ " + msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
}

///////////////////////////////////////////////////////////////
// PRE-FILL FORM (EDIT MODE)
///////////////////////////////////////////////////////////////
async function prefillForm(customerId) {
    try {
        const res    = await fetch(`/customer/${customerId}`);
        if (!res.ok) return;
        const result = await res.json();
        const data   = result.latestData;
        if (!data) return;

        const setVal = (id, val) => {
            if (!val && val !== 0) return;
            const el = document.getElementById(id);
            if (el) el.value = val;
        };

        setVal("loanType",             data.loanType);
        setVal("applicantName",        data.applicantName);
        setVal("applicantNumber",      data.applicantNumber);
        setVal("applicantEmail",       data.applicantEmail);
        setVal("dob",                  data.dob);
        setVal("applicationResidence", data.residentialAddress);
        setVal("bankCredit",           data.bankCredit);
        setVal("loanRequired",         data.loanRequired ? formatIndianNumberSystem(data.loanRequired) : "");

        // Trigger loan type change
        document.getElementById("loanType").dispatchEvent(new Event("change"));

        if (data.loanType?.includes("renewal")) {
            setVal("existingBank",     data.existingBank);
            setVal("outstandingAmount",data.outstandingAmount ? formatIndianNumberSystem(data.outstandingAmount) : "");
            setVal("currentEmi",       data.currentEmi ? formatIndianNumberSystem(data.currentEmi) : "");
            setVal("topupAmount",      data.topupAmount ? formatIndianNumberSystem(data.topupAmount) : "");
            setVal("interestRate",     data.interestRate);
            setVal("loanSince",        data.loanSince);
        }

        const isHlLap = data.loanType && (data.loanType.includes("-hl")||data.loanType.includes("-lap")||data.loanType.includes("-ppl")||data.loanType.includes("-p+c"));
        if (isHlLap) {
            setVal("propertyType",     data.propertyType);
            setVal("propertyLocation", data.propertyLocation);
            setVal("authorityType",    data.authorityType);
            setVal("budget",           data.budget ? formatIndianNumberSystem(data.budget) : "");
        }

        if (data.employmentType === "salaried") {
            const radio = document.querySelector('input[name="employmentType"][value="salaried"]');
            if (radio) { radio.checked = true; radio.dispatchEvent(new Event("change")); }
            setVal("companyName",      data.companyName);
            setVal("desg",             data.designation);
            setVal("companyIdCard",    data.companyIdCard);
            setVal("experience",       data.totalExperience);
            setVal("presentCompanyExp",data.presentCompanyExp);
            setVal("cibil",            data.cibil);
            setVal("grossSalary",      data.grossSalary ? formatIndianNumberSystem(data.grossSalary) : "");
            setVal("annualSalary",     data.annualSalary ? formatIndianNumberSystem(data.annualSalary) : "");
            setVal("currentCTC",       data.currentCTC ? formatIndianNumberSystem(data.currentCTC) : "");
            setVal("latestSalary",     data.latestSalary ? formatIndianNumberSystem(data.latestSalary) : "");
            setVal("lastSalary",       data.lastSalary ? formatIndianNumberSystem(data.lastSalary) : "");
            setVal("beforeLastSalary", data.beforeLastSalary ? formatIndianNumberSystem(data.beforeLastSalary) : "");
        }

        if (data.employmentType === "selfEmployed") {
            const radio = document.querySelector('input[name="employmentType"][value="selfEmployed"]');
            if (radio) { radio.checked = true; radio.dispatchEvent(new Event("change")); }
            setVal("businessName",  data.businessName);
            setVal("officePhone",   data.officePhone);
            setVal("businessType",  data.businessType);
            setVal("monthlyIncome", data.monthlyIncome ? formatIndianNumberSystem(data.monthlyIncome) : "");
            setVal("businessEmail", data.businessEmail);
            setVal("businessPhone", data.businessPhone);
            setVal("rentalIncome",  data.rentalIncome ? formatIndianNumberSystem(data.rentalIncome) : "");
            setVal("businessYears", data.businessYears);
        }

        if (data.coApplicant === "Yes") {
            setVal("coApplicant", "Yes");
            document.getElementById("coApplicantFields").style.display = "block";
            setVal("coName",             data.coName);
            setVal("coNumber",           data.coNumber);
            setVal("coEmail",            data.coEmail);
            setVal("coSalary",           data.coSalary ? formatIndianNumberSystem(data.coSalary) : "");
            setVal("coLatestSalary",     data.coLatestSalary ? formatIndianNumberSystem(data.coLatestSalary) : "");
            setVal("coLastSalary",       data.coLastSalary ? formatIndianNumberSystem(data.coLastSalary) : "");
            setVal("coBeforeLastSalary", data.coBeforeLastSalary ? formatIndianNumberSystem(data.coBeforeLastSalary) : "");
            setVal("coBankCredit",       data.coBankCredit);
            setVal("coLoanRequired",     data.coLoanRequired ? formatIndianNumberSystem(data.coLoanRequired) : "");
        }

        if (data.existingLoans?.length) data.existingLoans.forEach(l => addLoan(l));
        if (data.coLoans?.length)       data.coLoans.forEach(l => addCoLoan(l));

    } catch (err) {
        console.error("Pre-fill error:", err);
    }
}

    docCounter++;
    const container = document.getElementById("legalDocsContainer");
    const div = document.createElement("div");
    div.className = "legal-doc-block";
    div.innerHTML = `
        <h3>Linked Document ${docCounter}</h3>
        <div class="form-group"><label>Document Name</label>
            <select class="docName">
                <option value="">Select</option>
                <option>Sale Deed</option><option>Gift Deed</option>
                <option>Release Deed</option><option>Rectification Deed</option>
                <option>Partition Deed</option><option>Settlement Deed</option>
                <option>Development Agreement</option><option>GPA</option>
                <option>Will Deed</option>
            </select>
        </div>
        <div class="form-group"><label>Owner / Executant</label><input type="text" class="owner"></div>
        <div class="form-group"><label>In Favour Of</label><input type="text" class="favourof"></div>
        <div class="form-group"><label>Document Number</label><input type="text" class="docNumber"></div>
        <div class="form-group"><label>Registration Year</label><input type="text" class="regYear"></div>
        <h3>Boundaries</h3>

        <div class="form-group"><label>South</label><input type="text" class="southBoundary"></div>

        <div class="form-group"><label>West</label><input type="text" class="westBoundary"></div>
        <button type="button" onclick="this.parentElement.remove()" style="background:#ff4d4f;color:white;margin-top:10px;">Remove Document</button>
        <hr>`;
    container.appendChild(div);
}

</script>
